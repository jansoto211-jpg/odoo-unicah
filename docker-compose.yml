# Para una VM (Oracle Cloud Always Free u otra): Odoo + PostgreSQL + Caddy (HTTPS)
services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: odoo
      POSTGRES_USER: odoo
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data

  odoo:
    build: .
    restart: unless-stopped
    depends_on: [db]
    environment:
      DATABASE_URL: postgresql://odoo:${POSTGRES_PASSWORD}@db:5432/odoo
      ADMIN_PASSWD: ${ADMIN_PASSWD}
      ODOO_INIT: ${ODOO_INIT:-}
      ODOO_WORKERS: "2"
    volumes:
      - odoo-data:/var/lib/odoo

  caddy:
    image: caddy:2
    restart: unless-stopped
    depends_on: [odoo]
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data

volumes:
  pgdata:
  odoo-data:
  caddy-data:
